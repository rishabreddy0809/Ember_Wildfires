[project]
name = "ember-fire-ml"
version = "0.1.0"
description = "ML pipeline for Ember wildfire risk modeling"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "geopandas",
    "shapely",
    "pyproj",
    "pyarrow",
    "scipy",
    "matplotlib",
    "joblib",
    "rasterio>=1.4.4",
]

[tool.uv]
package = false
